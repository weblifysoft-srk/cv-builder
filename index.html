<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Cropper.js for Photo Cropping -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    
    <!-- PDF.js for AI Import -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    
    <style>
        /* Accordion Animations */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 5000px;
            opacity: 1;
        }
        .chevron { transition: transform 0.3s ease; }
        .chevron.open { transform: rotate(180deg); }
        
        /* Layout overrides for printing */
        @media print {
            body, html { 
                width: 100%; 
                height: auto !important; 
                margin: 0; 
                padding: 0; 
                background: white; 
                overflow: visible !important;
            }
            /* Sets exact 0.75 inch margins on every printed page */
            @page { margin: 0.75in; } 
            
            .print-hidden { display: none !important; }
            .print-block { display: block !important; width: 100% !important; max-width: none !important; }
            .print-no-shadow { box-shadow: none !important; border: none !important; }
            .print-p-0 { padding: 0 !important; }
            
            /* Hide the table headers/footers used for spacing */
            thead, tfoot { display: table-row-group; }
            /* Hide empty space elements in print */
            .print-spacing-hack { display: none; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col font-sans text-slate-800 h-screen overflow-hidden">

    <!-- Image Cropping Modal -->
    <div id="crop-modal" class="fixed inset-0 bg-slate-900/80 hidden z-[100] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-bold text-slate-800">Crop Profile Photo</h3>
                <button onclick="closeCropModal()" class="text-slate-400 hover:text-slate-700 transition-colors">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="p-4 flex-1 overflow-hidden bg-black flex justify-center items-center min-h-[300px]">
                <img id="crop-image" src="" class="max-w-full max-h-full block">
            </div>
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex justify-end space-x-3">
                <button onclick="closeCropModal()" class="px-4 py-2 text-slate-600 font-medium hover:bg-slate-200 rounded-lg transition-colors">Cancel</button>
                <button onclick="applyCrop()" class="px-6 py-2 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg shadow-md transition-colors">Crop & Save</button>
            </div>
        </div>
    </div>

    <header class="bg-white shadow-sm print-hidden lg:hidden flex justify-between items-center p-4 z-10 shrink-0">
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">ATS Builder</h1>
        <div class="flex space-x-2">
            <button id="tab-edit" onclick="switchTab('edit')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white">Edit</button>
            <button id="tab-preview" onclick="switchTab('preview')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-slate-100 text-slate-600">Preview</button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden flex-col lg:flex-row relative">
        
        <!-- LEFT PANEL: Form Editor -->
        <section id="panel-edit" class="w-full lg:w-[45%] xl:w-[40%] bg-white border-r border-slate-200 overflow-y-auto print-hidden block lg:block relative z-0 h-full pb-20 lg:pb-0">
            <div class="p-5 sm:p-6">
                <!-- Editor Header -->
                <div class="flex flex-col space-y-4 mb-6">
                    <div class="flex justify-between items-center">
                        <h1 class="text-2xl font-bold tracking-tight">Resume Data</h1>
                        
                        <!-- Data Actions -->
                        <div class="flex space-x-2">
                            <button onclick="exportData()" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors flex items-center space-x-1 shadow-sm" title="Download Backup (JSON)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            </button>
                            <label class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition-colors flex items-center space-x-1 shadow-sm cursor-pointer" title="Load Backup (JSON)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                <input type="file" accept=".json" class="hidden" onchange="importData(event)">
                            </label>
                        </div>
                    </div>
                    
                    <!-- AI Settings & Import -->
                    <div class="bg-blue-50 border border-blue-100 p-3 rounded-lg flex flex-col space-y-3">
                        <div class="flex items-center space-x-2">
                            <input type="password" id="api-key" placeholder="Gemini API Key (Optional for AI)" class="flex-1 form-input px-3 py-1.5 text-sm bg-white border border-blue-200 rounded shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                            <button id="btn-ai-import" onclick="document.getElementById('ai-cv-upload').click()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded shadow-sm transition-colors flex items-center space-x-1 whitespace-nowrap">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                                <span>Auto-Fill PDF</span>
                            </button>
                            <input type="file" id="ai-cv-upload" accept=".pdf,.txt" class="hidden" onchange="handleAiImport(event)">
                        </div>
                        <p class="text-[11px] text-blue-600 leading-tight">Your API key is stored locally in your browser. Used for AI Auto-Fill and AI Skill Extractor.</p>
                    </div>
                </div>

                <div class="space-y-4">
                    
                    <!-- Personal Information -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('personal')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <span>Personal Information</span>
                            </div>
                            <svg id="chevron-personal" class="chevron open text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-personal" class="accordion-content open">
                            <div class="p-4 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="flex flex-col space-y-1.5 md:col-span-2">
                                    <label class="text-sm font-semibold">Profile Photo (Optional)</label>
                                    <div class="flex items-center space-x-3">
                                        <input type="file" id="photo-upload" accept="image/*" class="hidden" onchange="handlePhotoSelect(event)">
                                        <button onclick="document.getElementById('photo-upload').click()" class="px-3 py-1.5 border border-slate-300 hover:bg-slate-50 rounded-lg text-sm font-medium transition-colors">Choose Photo</button>
                                        <button id="btn-clear-photo" onclick="clearPhoto()" class="hidden px-3 py-1.5 text-red-600 hover:bg-red-50 rounded-lg text-sm font-medium transition-colors">Remove</button>
                                    </div>
                                </div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Full Name</label><input type="text" id="p-fullName" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Job Title</label><input type="text" id="p-jobTitle" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Email</label><input type="email" id="p-email" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Phone</label><input type="text" id="p-phone" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Location</label><input type="text" id="p-location" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">LinkedIn</label><input type="text" id="p-linkedin" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5 md:col-span-2"><label class="text-sm font-semibold">GitHub / Portfolio</label><input type="text" id="p-github" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('summary')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
                                </span>
                                <span>Professional Summary</span>
                            </div>
                            <svg id="chevron-summary" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-summary" class="accordion-content">
                            <div class="p-4 border-t border-slate-100">
                                <div class="flex flex-col space-y-1.5">
                                    <textarea id="f-summary" spellcheck="true" rows="4" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y" placeholder="A brief overview of your background..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Work Experience -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('experience')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                </span>
                                <span>Work Experience</span>
                            </div>
                            <svg id="chevron-experience" class="chevron open text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-experience" class="accordion-content open">
                            <div class="p-4 border-t border-slate-100 space-y-6">
                                <div id="experience-container" class="space-y-6"></div>
                                <button onclick="addExperience()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-600 font-medium hover:border-blue-500 hover:text-blue-600 transition-colors flex items-center justify-center space-x-2">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    <span>Add New Experience</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Education -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('education')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                                </span>
                                <span>Education</span>
                            </div>
                            <svg id="chevron-education" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-education" class="accordion-content">
                            <div class="p-4 border-t border-slate-100 space-y-6">
                                <div id="education-container" class="space-y-6"></div>
                                <button onclick="addEducation()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-600 font-medium hover:border-blue-500 hover:text-blue-600 transition-colors flex items-center justify-center space-x-2">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    <span>Add New Education</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Skills -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('skills')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                                </span>
                                <span>Skills</span>
                            </div>
                            <svg id="chevron-skills" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-skills" class="accordion-content">
                            <div class="p-4 border-t border-slate-100">
                                
                                <div class="mb-4 p-3 bg-blue-50 border border-blue-100 rounded-lg">
                                    <label class="text-xs font-semibold text-blue-800 mb-1 block">AI Skill Extractor</label>
                                    <div class="flex space-x-2">
                                        <input type="text" id="job-desc-input" placeholder="Paste job description URL or text here..." class="flex-1 form-input px-3 py-1.5 text-sm bg-white border border-blue-200 rounded shadow-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                                        <button id="btn-extract-skills" onclick="extractSkills()" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded shadow-sm transition-colors whitespace-nowrap">Extract</button>
                                    </div>
                                </div>

                                <div class="flex flex-col space-y-1.5">
                                    <label class="text-sm font-semibold">Core Skills (Comma separated)</label>
                                    <textarea id="f-skills" spellcheck="true" rows="4" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y" placeholder="JavaScript, React, Agile..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Live Preview -->
        <section id="panel-preview" class="w-full lg:w-[55%] xl:w-[60%] bg-slate-400 overflow-y-auto p-4 lg:p-8 flex justify-center print-block print-p-0 print:bg-white hidden lg:flex h-full">
            
            <div class="w-full max-w-[850px] print:max-w-none flex flex-col items-center">
                <!-- Action Bar -->
                <div class="w-full flex justify-between items-center mb-4 print-hidden px-2 shrink-0">
                    <div class="flex items-center space-x-2 text-sm text-slate-100 bg-slate-700/50 px-3 py-1.5 rounded-full shadow-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span>ATS Compliant Preview</span>
                    </div>
                    <button onclick="downloadPDF()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-lg font-medium transition-all hover:-translate-y-0.5">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Download PDF</span>
                    </button>
                </div>

                <!-- ACTUAL RESUME DOCUMENT -->
                <div class="bg-white shadow-2xl print-no-shadow w-full min-h-[1056px] text-black print-p-0" style="font-family: Georgia, 'Times New Roman', serif;">
                    
                    <!-- Print Table Hack: Forces uniform margins on every printed page -->
                    <table class="w-full border-collapse border-0">
                        <!-- Space for Top Margin -->
                        <thead class="print-hidden"><tr><td style="height: 15mm;"></td></tr></thead>
                        <tbody>
                            <tr>
                                <td class="p-10 sm:p-12 print-p-0 align-top">
                                    <div id="resume-content">
                                        <!-- Content injected via JS -->
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                        <!-- Space for Bottom Margin -->
                        <tfoot class="print-hidden"><tr><td style="height: 15mm;"></td></tr></tfoot>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        // Default Data
        const defaultData = {
            personal: { fullName: 'Alex Jonathan Doe', jobTitle: 'Software Engineer', email: 'alex.doe@example.com', phone: '+1 (555) 123-4567', location: 'San Francisco, CA', linkedin: 'linkedin.com/in/alexdoe', github: 'github.com/alexdoe', photo: null },
            summary: 'Detail-oriented and highly adaptable Software Engineer with 5+ years of experience in full-stack web development. Proven track record of architecting scalable applications and improving system performance.',
            experience: [ { id: 1, title: 'Senior Software Engineer', company: 'Tech Innovators Inc.', location: 'San Francisco, CA', startDate: 'Jan 2021', endDate: 'Present', description: '• Spearheaded the migration of a legacy monolithic application to a microservices architecture, reducing deployment time by 40%.\n• Managed a team of 4 frontend engineers.\n• Optimized database queries, resulting in a 25% reduction in API response times.' } ],
            education: [ { id: 1, degree: 'Bachelor of Science in Computer Science', institution: 'University of California, Berkeley', location: 'Berkeley, CA', startDate: 'Aug 2014', endDate: 'May 2018', gpa: '3.8/4.0' } ],
            skills: 'JavaScript, TypeScript, React, Node.js, Python, SQL, Docker, AWS, Git, Agile Methodologies'
        };

        let data = JSON.parse(JSON.stringify(defaultData));
        let cropper = null;

        // Initialize App on Load
        document.addEventListener('DOMContentLoaded', () => {
            // Setup PDF.js worker securely
            if (window['pdfjs-dist/build/pdf']) {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
            }

            // Load API Key
            const savedKey = localStorage.getItem('ats_gemini_api_key');
            if(savedKey) document.getElementById('api-key').value = savedKey;

            // Load Local Storage Data
            try {
                const savedData = localStorage.getItem('ats_resume_data');
                if (savedData) data = JSON.parse(savedData);
            } catch(e) { console.error('Corrupt save data, using defaults.'); }

            // Initial Renders
            initFormValues();
            renderExperienceForms();
            renderEducationForms();
            renderPreview();
            setupEventListeners();
        });

        function saveToMemory() {
            localStorage.setItem('ats_resume_data', JSON.stringify(data));
        }

        function setupEventListeners() {
            const personalFields = ['fullName', 'jobTitle', 'email', 'phone', 'location', 'linkedin', 'github'];
            personalFields.forEach(field => {
                const el = document.getElementById(`p-${field}`);
                if(el) el.addEventListener('input', (e) => {
                    data.personal[field] = e.target.value;
                    renderPreview();
                    saveToMemory();
                });
            });

            document.getElementById('f-summary').addEventListener('input', (e) => { data.summary = e.target.value; renderPreview(); saveToMemory(); });
            document.getElementById('f-skills').addEventListener('input', (e) => { data.skills = e.target.value; renderPreview(); saveToMemory(); });

            document.getElementById('experience-container').addEventListener('input', (e) => {
                if (e.target.classList.contains('dyn-input')) {
                    const id = parseInt(e.target.dataset.id);
                    const field = e.target.dataset.field;
                    const item = data.experience.find(x => x.id === id);
                    if (item) { item[field] = e.target.value; renderPreview(); saveToMemory(); }
                }
            });

        function exportData() {
            const dataStr = JSON.stringify(data, null, 2);

        function importData(e) {

        async function handleAiImport(e) {
            const file = e.target.files[0];
            if (!file) return;
            const apiKey = document.getElementById('api-key').value.trim();
            if(!apiKey) return alert("Please enter your Gemini API Key first.");

            const btn = document.getElementById('btn-ai-import');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Extracting...';
            btn.disabled = true;

            try {
                let extractedText = '';
                if(file.type === 'application/pdf') {
                    const arrayBuffer = await file.arrayBuffer();
                    const pdf = await pdfjsLib.getDocument({data: new Uint8Array(arrayBuffer)}).promise;
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        extractedText += textContent.items.map(s => s.str).join(' ') + '\n';
                    }
                } else {
                    extractedText = await file.text();
                }

                if(!extractedText.trim()) throw new Error("Could not read text from document.");

                const prompt = `
You are a CV parser. Extract the information from the following text and format it EXACTLY according to the JSON structure provided.
Do NOT include any explanations, introductory text, or markdown blocks (like \`\`\`json). Return ONLY raw JSON.

JSON STRUCTURE:
{
  "personal": { "fullName": "", "jobTitle": "", "email": "", "phone": "", "location": "", "linkedin": "", "github": "" },
  "summary": "",
  "experience": [ { "id": 1, "title": "", "company": "", "location": "", "startDate": "", "endDate": "", "description": "" } ],
  "education": [ { "id": 1, "degree": "", "institution": "", "location": "", "startDate": "", "endDate": "", "gpa": "" } ],
  "skills": "Comma separated string of skills"
}

TEXT TO PARSE:
${extractedText.substring(0, 15000)}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });

                if(!response.ok) {
                    const errStr = await response.text();
                    throw new Error("API Error: " + errStr);
                }

                const jsonResp = await response.json();
                let jsonStr = jsonResp.candidates[0].content.parts[0].text;
                
                // Cleanup Markdown if AI hallucinated it despite responseMimeType
                jsonStr = jsonStr.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/i, '').trim();

                const parsedData = JSON.parse(jsonStr);
                
                // Merge retaining photo
                const existingPhoto = data.personal.photo;
                data = { ...defaultData, ...parsedData }; // Ensure array structure exists
                
                // Re-assign array IDs so UI logic doesn't break
                if(data.experience) data.experience.forEach((e, i) => e.id = Date.now() + i);
                if(data.education) data.education.forEach((e, i) => e.id = Date.now() + 100 + i);
                data.personal.photo = existingPhoto;

                initFormValues(); renderExperienceForms(); renderEducationForms(); renderPreview(); saveToMemory();
                
                btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg><span>Success!</span>`;
            } catch(error) {
                console.error(error);
                alert("Import failed: " + error.message);
                btn.innerHTML = 'Error. Try Again.';
            } finally {
                e.target.value = '';
                setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
            }
        }

        async function extractSkills() {
            const apiKey = document.getElementById('api-key').value.trim();
            const jobDesc = document.getElementById('job-desc-input').value.trim();
            
            if(!apiKey) return alert("Please enter your Gemini API Key first.");
            if(!jobDesc) return alert("Please paste a job description or keywords first.");

            const btn = document.getElementById('btn-extract-skills');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Extracting...';
            btn.disabled = true;

            try {
                const prompt = `Analyze this job description. Extract the core hard skills and technical requirements. Return a single, comma-separated string of these skills. Do NOT return markdown or conversational text. Just the skills.\n\nDescription: ${jobDesc}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if(!response.ok) throw new Error(await response.text());
                
                const jsonResp = await response.json();
                let skillsText = jsonResp.candidates[0].content.parts[0].text.trim();
                
                // Append to existing
                const existing = document.getElementById('f-skills').value;
                const combined = existing ? `${existing}, ${skillsText}` : skillsText;
                
                // Clean duplicates (simple)
                const uniqueSkills = [...new Set(combined.split(',').map(s => s.trim()).filter(s => s))].join(', ');
                
                data.skills = uniqueSkills;
                document.getElementById('f-skills').value = uniqueSkills;
                renderPreview(); saveToMemory();
                
                btn.innerHTML = 'Added!';
                document.getElementById('job-desc-input').value = ''; // clear
            } catch(error) {
                console.error(error);
                alert("Skill Extraction failed: " + error.message);
                btn.innerHTML = 'Failed';
            } finally {
                setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; }, 3000);
            }
        }

                                <span class="text-sm font-semibold text-gray-700 whitespace-nowrap ml-2">${escapeHtml(exp.startDate)} ${(exp.startDate && exp.endDate) ? '–' : ''} ${escapeHtml(exp.endDate)}</span>

                html += `<section class="mb-6"><h2 class="text-lg font-bold uppercase tracking-widest border-b border-gray-300 mb-3 pb-1 text-gray-900">Education</h2><div class="space-y-4">`;

        function downloadPDF() {
            // Setup dynamic file name
            const originalTitle = document.title;
            const name = data.personal.fullName ? data.personal.fullName.replace(/\s+/g, '_') : 'Resume';
            const position = data.personal.jobTitle ? `_${data.personal.jobTitle.replace(/\s+/g, '_')}` : '';
            document.title = `${name}${position}`;
            
            // Trigger native browser print which respects the @media print CSS
            window.print();
            
            // Restore title
            document.title = originalTitle;
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function renderBullets(text) {
            if (!text) return '';
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const hasBullets = lines.some(l => l.trim().match(/^[•\-*]/));
            
            if (!hasBullets && lines.length === 1) return `<p>${escapeHtml(text)}</p>`;
            
            return `<ul class="list-disc list-outside ml-4 space-y-1">` + 
                lines.map(line => {
                    const clean = escapeHtml(line.replace(/^[•\-*]\s*/, '').trim());
                    return `<li class="pl-1">${clean}</li>`;
                }).join('') + `</ul>`;
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`acc-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            content.classList.toggle('open');
            chevron.classList.toggle('open');
        }

        function switchTab(tab) {
            const editPanel = document.getElementById('panel-edit');
            const previewPanel = document.getElementById('panel-preview');
            const tabEdit = document.getElementById('tab-edit');
            const tabPreview = document.getElementById('tab-preview');

            if (tab === 'edit') {
                editPanel.classList.remove('hidden');
                editPanel.classList.add('block');
                previewPanel.classList.remove('flex');
                previewPanel.classList.add('hidden');
                
                tabEdit.classList.replace('bg-slate-100', 'bg-blue-600');
                tabEdit.classList.replace('text-slate-600', 'text-white');
                tabPreview.classList.replace('bg-blue-600', 'bg-slate-100');
                tabPreview.classList.replace('text-white', 'text-slate-600');
            } else {
                editPanel.classList.remove('block');
                editPanel.classList.add('hidden');
                previewPanel.classList.remove('hidden');
                previewPanel.classList.add('flex');

                tabPreview.classList.replace('bg-slate-100', 'bg-blue-600');
                tabPreview.classList.replace('text-slate-600', 'text-white');
                tabEdit.classList.replace('bg-blue-600', 'bg-slate-100');
                tabEdit.classList.replace('text-white', 'text-slate-600');
            }
        }
