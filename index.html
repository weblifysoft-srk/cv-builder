<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATS Resume Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for accordions and printing */
        .accordion-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .accordion-content.open {
            max-height: 3000px; /* Large enough to fit content */
            opacity: 1;
        }
        .chevron {
            transition: transform 0.3s ease;
        }
        .chevron.open {
            transform: rotate(180deg);
        }
        
        /* Print styles for generating PDF */
        @media print {
            body, html { width: 100%; height: 100%; margin: 0; padding: 0; background: white; }
            @page { margin: 0; size: letter; }
            .print-hidden { display: none !important; }
            .print-block { display: block !important; width: 100% !important; max-width: none !important; }
            .print-no-shadow { box-shadow: none !important; }
            .print-p-8 { padding: 2rem !important; }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-100 flex flex-col font-sans text-slate-800">

    <!-- Mobile Header / Tabs -->
    <header class="bg-white shadow-sm print-hidden lg:hidden flex justify-between items-center p-4">
        <h1 class="text-xl font-bold text-slate-800 tracking-tight">ATS Builder</h1>
        <div class="flex space-x-2">
            <button id="tab-edit" onclick="switchTab('edit')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-blue-600 text-white">Edit</button>
            <button id="tab-preview" onclick="switchTab('preview')" class="px-4 py-2 rounded-md text-sm font-medium transition-colors bg-slate-100 text-slate-600">Preview</button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden flex-col lg:flex-row">
        
        <!-- LEFT PANEL: Form Editor -->
        <section id="panel-edit" class="w-full lg:w-[45%] xl:w-[40%] bg-white border-r border-slate-200 overflow-y-auto print-hidden block lg:block">
            <div class="p-6">
                <div class="hidden lg:flex justify-between items-center mb-8">
                    <h1 class="text-2xl font-bold tracking-tight">Resume Data</h1>
                    <p class="text-sm text-slate-500 font-medium">Auto-updates preview</p>
                </div>

                <div class="space-y-6 pb-20">
                    
                    <!-- Personal Information -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('personal')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                </span>
                                <span>Personal Information</span>
                            </div>
                            <svg id="chevron-personal" class="chevron open text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-personal" class="accordion-content open">
                            <div class="p-4 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Full Name</label><input type="text" id="p-fullName" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Job Title (Optional)</label><input type="text" id="p-jobTitle" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="e.g. Software Engineer"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Email</label><input type="email" id="p-email" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Phone</label><input type="text" id="p-phone" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">Location</label><input type="text" id="p-location" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5"><label class="text-sm font-semibold">LinkedIn</label><input type="text" id="p-linkedin" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                                <div class="flex flex-col space-y-1.5 md:col-span-2"><label class="text-sm font-semibold">GitHub / Portfolio</label><input type="text" id="p-github" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Summary -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('summary')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                                </span>
                                <span>Professional Summary</span>
                            </div>
                            <svg id="chevron-summary" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-summary" class="accordion-content">
                            <div class="p-4 border-t border-slate-100">
                                <div class="flex flex-col space-y-1.5">
                                    <textarea id="f-summary" rows="4" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y" placeholder="A brief overview of your background..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Work Experience -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('experience')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                                </span>
                                <span>Work Experience</span>
                            </div>
                            <svg id="chevron-experience" class="chevron open text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-experience" class="accordion-content open">
                            <div class="p-4 border-t border-slate-100 space-y-6">
                                <div id="experience-container" class="space-y-6"></div>
                                <button onclick="addExperience()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-600 font-medium hover:border-blue-500 hover:text-blue-600 transition-colors flex items-center justify-center space-x-2">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    <span>Add New Experience</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Education -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('education')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
                                </span>
                                <span>Education</span>
                            </div>
                            <svg id="chevron-education" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-education" class="accordion-content">
                            <div class="p-4 border-t border-slate-100 space-y-6">
                                <div id="education-container" class="space-y-6"></div>
                                <button onclick="addEducation()" class="w-full py-3 border-2 border-dashed border-slate-300 rounded-lg text-slate-600 font-medium hover:border-blue-500 hover:text-blue-600 transition-colors flex items-center justify-center space-x-2">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    <span>Add New Education</span>
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Skills -->
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                        <button onclick="toggleAccordion('skills')" class="w-full flex items-center justify-between p-4 bg-slate-50 hover:bg-slate-100 transition-colors focus:outline-none">
                            <div class="flex items-center space-x-3 font-semibold">
                                <span class="text-blue-600">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
                                </span>
                                <span>Skills</span>
                            </div>
                            <svg id="chevron-skills" class="chevron text-slate-400" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                        </button>
                        <div id="acc-skills" class="accordion-content">
                            <div class="p-4 border-t border-slate-100">
                                <div class="flex flex-col space-y-1.5">
                                    <label class="text-sm font-semibold">Core Skills (Comma separated)</label>
                                    <textarea id="f-skills" rows="4" class="form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-y" placeholder="JavaScript, React, Agile..."></textarea>
                                </div>
                                <p class="mt-2 text-xs text-slate-500">ATS parsers look for exact keyword matches. Ensure you list hard skills directly found in the job description.</p>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Live Preview -->
        <section id="panel-preview" class="w-full lg:w-[55%] xl:w-[60%] bg-slate-400 overflow-y-auto p-4 lg:p-8 flex justify-center print-block print-p-0 print:bg-white hidden lg:flex">
            
            <div class="w-full max-w-[850px] print:max-w-none flex flex-col items-center">
                <!-- Action Bar -->
                <div class="w-full flex justify-between items-center mb-4 print-hidden px-2">
                    <div class="flex items-center space-x-2 text-sm text-slate-100 bg-slate-700/50 px-3 py-1.5 rounded-full shadow-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>
                        <span>ATS Compliant Preview</span>
                    </div>
                    <button onclick="downloadPDF()" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg shadow-lg font-medium transition-all hover:-translate-y-0.5">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span>Download PDF</span>
                    </button>
                </div>

                <!-- ACTUAL RESUME DOCUMENT -->
                <div id="resume-document" class="bg-white shadow-2xl print-no-shadow w-full min-h-[1056px] text-black p-10 sm:p-12 print-p-8" style="font-family: Georgia, 'Times New Roman', serif;">
                    <!-- Content injected via JS -->
                </div>
            </div>
        </section>

    </main>

    <script>
        // --- State Management ---
        let data = {
            personal: {
                fullName: 'Alex Jonathan Doe', jobTitle: 'Software Engineer', email: 'alex.doe@example.com', 
                phone: '+1 (555) 123-4567', location: 'San Francisco, CA', linkedin: 'linkedin.com/in/alexdoe', github: 'github.com/alexdoe'
            },
            summary: 'Detail-oriented and highly adaptable Software Engineer with 5+ years of experience in full-stack web development. Proven track record of architecting scalable applications and improving system performance.',
            experience: [
                { id: 1, title: 'Senior Software Engineer', company: 'Tech Innovators Inc.', location: 'San Francisco, CA', startDate: 'Jan 2021', endDate: 'Present', description: '• Spearheaded the migration of a legacy monolithic application to a microservices architecture, reducing deployment time by 40%.\n• Managed a team of 4 frontend engineers.\n• Optimized database queries, resulting in a 25% reduction in API response times.' }
            ],
            education: [
                { id: 1, degree: 'Bachelor of Science in Computer Science', institution: 'University of California, Berkeley', location: 'Berkeley, CA', startDate: 'Aug 2014', endDate: 'May 2018', gpa: '3.8/4.0' }
            ],
            skills: 'JavaScript, TypeScript, React, Node.js, Python, SQL, Docker, AWS, Git, Agile Methodologies'
        };

        // --- Initialization & Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            initFormValues();
            renderExperienceForms();
            renderEducationForms();
            renderPreview();

            // Personal Info Listeners
            const personalFields = ['fullName', 'jobTitle', 'email', 'phone', 'location', 'linkedin', 'github'];
            personalFields.forEach(field => {
                document.getElementById(`p-${field}`).addEventListener('input', (e) => {
                    data.personal[field] = e.target.value;
                    renderPreview();
                });
            });

            // Summary & Skills Listeners
            document.getElementById('f-summary').addEventListener('input', (e) => { data.summary = e.target.value; renderPreview(); });
            document.getElementById('f-skills').addEventListener('input', (e) => { data.skills = e.target.value; renderPreview(); });

            // Dynamic Lists Event Delegation (Experience)
            document.getElementById('experience-container').addEventListener('input', (e) => {
                if (e.target.classList.contains('dyn-input')) {
                    const id = parseInt(e.target.dataset.id);
                    const field = e.target.dataset.field;
                    const item = data.experience.find(x => x.id === id);
                    if (item) { item[field] = e.target.value; renderPreview(); }
                }
            });

            // Dynamic Lists Event Delegation (Education)
            document.getElementById('education-container').addEventListener('input', (e) => {
                if (e.target.classList.contains('dyn-input')) {
                    const id = parseInt(e.target.dataset.id);
                    const field = e.target.dataset.field;
                    const item = data.education.find(x => x.id === id);
                    if (item) { item[field] = e.target.value; renderPreview(); }
                }
            });
        });

        // --- Form Rendering Functions ---
        function initFormValues() {
            Object.keys(data.personal).forEach(key => {
                if (document.getElementById(`p-${key}`)) document.getElementById(`p-${key}`).value = data.personal[key];
            });
            document.getElementById('f-summary').value = data.summary;
            document.getElementById('f-skills').value = data.skills;
        }

        function renderExperienceForms() {
            const container = document.getElementById('experience-container');
            container.innerHTML = data.experience.map((exp, index) => `
                <div class="p-4 border border-slate-200 rounded-lg bg-slate-50 relative group">
                    <button onclick="removeExperience(${exp.id})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors" title="Remove"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    <h4 class="text-sm font-semibold text-slate-700 mb-4 uppercase tracking-wider">Experience #${index + 1}</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Job Title</label><input type="text" data-id="${exp.id}" data-field="title" value="${escapeHtml(exp.title)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Company</label><input type="text" data-id="${exp.id}" data-field="company" value="${escapeHtml(exp.company)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Location</label><input type="text" data-id="${exp.id}" data-field="location" value="${escapeHtml(exp.location)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="grid grid-cols-2 gap-2">
                            <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Start Date</label><input type="text" data-id="${exp.id}" data-field="startDate" value="${escapeHtml(exp.startDate)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="MMM YYYY"></div>
                            <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">End Date</label><input type="text" data-id="${exp.id}" data-field="endDate" value="${escapeHtml(exp.endDate)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Present"></div>
                        </div>
                        <div class="flex flex-col space-y-1.5 md:col-span-2"><label class="text-xs font-semibold">Description (Use • or - for bullets)</label><textarea data-id="${exp.id}" data-field="description" rows="4" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">${escapeHtml(exp.description)}</textarea></div>
                    </div>
                </div>
            `).join('');
        }

        function renderEducationForms() {
            const container = document.getElementById('education-container');
            container.innerHTML = data.education.map((edu, index) => `
                <div class="p-4 border border-slate-200 rounded-lg bg-slate-50 relative group">
                    <button onclick="removeEducation(${edu.id})" class="absolute top-4 right-4 text-slate-400 hover:text-red-500 transition-colors" title="Remove"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    <h4 class="text-sm font-semibold text-slate-700 mb-4 uppercase tracking-wider">Education #${index + 1}</h4>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Degree / Program</label><input type="text" data-id="${edu.id}" data-field="degree" value="${escapeHtml(edu.degree)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Institution Name</label><input type="text" data-id="${edu.id}" data-field="institution" value="${escapeHtml(edu.institution)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Location</label><input type="text" data-id="${edu.id}" data-field="location" value="${escapeHtml(edu.location)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">GPA (Optional)</label><input type="text" data-id="${edu.id}" data-field="gpa" value="${escapeHtml(edu.gpa || '')}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        <div class="grid grid-cols-2 gap-2 md:col-span-2">
                            <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">Start Date</label><input type="text" data-id="${edu.id}" data-field="startDate" value="${escapeHtml(edu.startDate)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                            <div class="flex flex-col space-y-1.5"><label class="text-xs font-semibold">End Date</label><input type="text" data-id="${edu.id}" data-field="endDate" value="${escapeHtml(edu.endDate)}" class="dyn-input form-input px-3 py-2 bg-white border border-slate-300 rounded-lg shadow-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // --- Data Manipulation Functions ---
        function addExperience() {
            data.experience.push({ id: Date.now(), title: '', company: '', location: '', startDate: '', endDate: '', description: '' });
            renderExperienceForms(); renderPreview();
        }
        function removeExperience(id) {
            data.experience = data.experience.filter(exp => exp.id !== id);
            renderExperienceForms(); renderPreview();
        }
        function addEducation() {
            data.education.push({ id: Date.now(), institution: '', degree: '', location: '', startDate: '', endDate: '', gpa: '' });
            renderEducationForms(); renderPreview();
        }
        function removeEducation(id) {
            data.education = data.education.filter(edu => edu.id !== id);
            renderEducationForms(); renderPreview();
        }

        // --- Preview Rendering Logic ---
        function renderPreview() {
            const p = data.personal;
            let html = `
                <header class="text-center mb-6 pb-4 border-b-[1.5px] border-black">
                    <h1 class="text-3xl sm:text-4xl font-bold uppercase tracking-wide mb-2">${escapeHtml(p.fullName) || 'YOUR NAME'}</h1>
                    ${p.jobTitle ? `<h2 class="text-lg text-gray-800 mb-3">${escapeHtml(p.jobTitle)}</h2>` : ''}
                    
                    <div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-1 text-sm sm:text-base text-gray-800">
                        ${p.location ? `<span>${escapeHtml(p.location)}</span>` : ''}
                        ${p.phone ? `${p.location ? '<span class="text-gray-400">|</span>' : ''}<span>${escapeHtml(p.phone)}</span>` : ''}
                        ${p.email ? `${(p.location || p.phone) ? '<span class="text-gray-400">|</span>' : ''}<a href="mailto:${escapeHtml(p.email)}" class="hover:underline">${escapeHtml(p.email)}</a>` : ''}
                    </div>
                    
                    <div class="flex flex-wrap justify-center items-center gap-x-3 gap-y-1 text-sm sm:text-base text-gray-800 mt-1">
                        ${p.linkedin ? `<a href="https://${escapeHtml(p.linkedin).replace(/^https?:\/\//, '')}" class="hover:underline">${escapeHtml(p.linkedin).replace(/^https?:\/\//, '')}</a>` : ''}
                        ${(p.linkedin && p.github) ? '<span class="text-gray-400">|</span>' : ''}
                        ${p.github ? `<a href="https://${escapeHtml(p.github).replace(/^https?:\/\//, '')}" class="hover:underline">${escapeHtml(p.github).replace(/^https?:\/\//, '')}</a>` : ''}
                    </div>
                </header>
            `;

            if (data.summary.trim()) {
                html += `
                    <section class="mb-6">
                        <h2 class="text-lg font-bold uppercase tracking-widest border-b border-gray-300 mb-3 pb-1 text-gray-900">Professional Summary</h2>
                        <p class="text-[15px] leading-relaxed text-gray-800 text-justify">${escapeHtml(data.summary)}</p>
                    </section>
                `;
            }

            if (data.experience.length > 0) {
                html += `<section class="mb-6"><h2 class="text-lg font-bold uppercase tracking-widest border-b border-gray-300 mb-3 pb-1 text-gray-900">Work Experience</h2><div class="space-y-5">`;
                data.experience.forEach(exp => {
                    html += `
                        <div class="break-inside-avoid">
                            <div class="flex justify-between items-baseline mb-1">
                                <h3 class="text-[16px] font-bold text-gray-900">${escapeHtml(exp.title)}${exp.company ? `<span class="font-normal italic"> at ${escapeHtml(exp.company)}</span>` : ''}</h3>
                                <span class="text-sm font-semibold text-gray-700 whitespace-nowrap ml-2">${escapeHtml(exp.startDate)} ${(exp.startDate && exp.endDate) ? '–' : ''} ${escapeHtml(exp.endDate)}</span>
                            </div>
                            ${exp.location ? `<div class="text-sm text-gray-600 mb-2 italic">${escapeHtml(exp.location)}</div>` : ''}
                            ${exp.description ? `<div class="text-[14.5px] leading-snug text-gray-800">${renderBullets(exp.description)}</div>` : ''}
                        </div>
                    `;
                });
                html += `</div></section>`;
            }

            if (data.education.length > 0) {
                html += `<section class="mb-6"><h2 class="text-lg font-bold uppercase tracking-widest border-b border-gray-300 mb-3 pb-1 text-gray-900">Education</h2><div class="space-y-4">`;
                data.education.forEach(edu => {
                    html += `
                        <div class="break-inside-avoid">
                            <div class="flex justify-between items-baseline mb-1">
                                <h3 class="text-[16px] font-bold text-gray-900">${escapeHtml(edu.degree)}</h3>
                                <span class="text-sm font-semibold text-gray-700 whitespace-nowrap ml-2">${escapeHtml(edu.startDate)} ${(edu.startDate && edu.endDate) ? '–' : ''} ${escapeHtml(edu.endDate)}</span>
                            </div>
                            <div class="flex justify-between items-baseline">
                                <span class="text-[15px] italic text-gray-800">${escapeHtml(edu.institution)}${(edu.institution && edu.location) ? ',' : ''} ${escapeHtml(edu.location)}</span>
                                ${edu.gpa ? `<span class="text-sm text-gray-700">GPA: ${escapeHtml(edu.gpa)}</span>` : ''}
                            </div>
                        </div>
                    `;
                });
                html += `</div></section>`;
            }

            if (data.skills.trim()) {
                html += `
                    <section class="mb-6 break-inside-avoid">
                        <h2 class="text-lg font-bold uppercase tracking-widest border-b border-gray-300 mb-3 pb-1 text-gray-900">Technical & Professional Skills</h2>
                        <p class="text-[15px] leading-relaxed text-gray-800">${escapeHtml(data.skills)}</p>
                    </section>
                `;
            }

            document.getElementById('resume-document').innerHTML = html;
        }

        // --- Utility Functions ---
        function downloadPDF() {
            // Save the original title
            const originalTitle = document.title;
            
            // Construct the new title for the PDF filename
            const name = data.personal.fullName ? data.personal.fullName.replace(/\s+/g, '_') : 'Resume';
            const jobPosition = data.personal.jobTitle ? data.personal.jobTitle.replace(/\s+/g, '_') : 'Applicant';
            document.title = `${name}_${jobPosition}`;
            
            // Trigger print dialog
            window.print();
            
            // Restore original title after a short delay to ensure print dialog grabs the new one
            setTimeout(() => {
                document.title = originalTitle;
            }, 100);
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return unsafe.toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        function renderBullets(text) {
            if (!text) return '';
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const hasBullets = lines.some(l => l.trim().match(/^[•\-*]/));
            
            if (!hasBullets && lines.length === 1) return `<p>${escapeHtml(text)}</p>`;
            
            return `<ul class="list-disc list-outside ml-4 space-y-1">` + 
                lines.map(line => {
                    const clean = escapeHtml(line.replace(/^[•\-*]\s*/, '').trim());
                    return `<li class="pl-1">${clean}</li>`;
                }).join('') + `</ul>`;
        }

        // --- UI Interactions ---
        function toggleAccordion(id) {
            const content = document.getElementById(`acc-${id}`);
            const chevron = document.getElementById(`chevron-${id}`);
            content.classList.toggle('open');
            chevron.classList.toggle('open');
        }

        function switchTab(tab) {
            const editPanel = document.getElementById('panel-edit');
            const previewPanel = document.getElementById('panel-preview');
            const tabEdit = document.getElementById('tab-edit');
            const tabPreview = document.getElementById('tab-preview');

            if (tab === 'edit') {
                editPanel.classList.remove('hidden');
                editPanel.classList.add('block');
                previewPanel.classList.remove('flex');
                previewPanel.classList.add('hidden');
                
                tabEdit.classList.replace('bg-slate-100', 'bg-blue-600');
                tabEdit.classList.replace('text-slate-600', 'text-white');
                tabPreview.classList.replace('bg-blue-600', 'bg-slate-100');
                tabPreview.classList.replace('text-white', 'text-slate-600');
            } else {
                editPanel.classList.remove('block');
                editPanel.classList.add('hidden');
                previewPanel.classList.remove('hidden');
                previewPanel.classList.add('flex');

                tabPreview.classList.replace('bg-slate-100', 'bg-blue-600');
                tabPreview.classList.replace('text-slate-600', 'text-white');
                tabEdit.classList.replace('bg-blue-600', 'bg-slate-100');
                tabEdit.classList.replace('text-white', 'text-slate-600');
            }
        }
    </script>
</body>
</html>
